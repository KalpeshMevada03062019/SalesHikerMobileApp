# Page action: type into the (empty) password field. Params: PASSWORD, optional PRESS_ENTER=true
# (submits with the keyboard's Enter key instead of leaving the keyboard to the caller).
# Same focus-then-type approach as enter-email.yaml.
# The console label hides the value; the runner also redacts TEST_PASSWORD from reports.
appId: ${MAESTRO_APP_ID || 'com.saleshiker.app'}
---
- runScript: sign-in.page.js
- retry:
    maxRetries: 3
    commands:
      - tapOn: ${output.signIn.passwordField}
      - assertVisible:
          text: ${output.signIn.passwordField}
          focused: true
- inputText:
    text: ${PASSWORD}
    label: "Enter password (value hidden)"
- runFlow:
    when:
      true: ${typeof PRESS_ENTER !== 'undefined' && PRESS_ENTER == 'true'}
    commands:
      - pressKey: Enter
- runFlow: ../shared/hide-keyboard.yaml
