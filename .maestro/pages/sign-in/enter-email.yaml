# Page action: type into the (empty) email field. Params: EMAIL
# Precondition: the field is empty. launch-app.yaml clears state, so it always is at test start.
# Do not add eraseText: it can close the keyboard, and the hideKeyboard below then sends BACK,
# which exits the app from this root screen.
appId: ${MAESTRO_APP_ID || 'com.saleshiker.app'}
---
- runScript: sign-in.page.js
- tapOn: ${output.signIn.emailField}
- inputText: ${EMAIL}
- hideKeyboard
