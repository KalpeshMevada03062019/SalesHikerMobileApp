# Subflow: start the app from a clean state and wait for the sign-in screen.
# clearState wipes app data (session, theme choice), so every test starts signed out.
appId: ${MAESTRO_APP_ID || 'com.saleshiker.app'}
---
- runScript: ../../pages/sign-in/sign-in.page.js
- stopApp
- launchApp:
    clearState: true
# On a loaded emulator, other apps can raise system dialogs over the app: ANR
# ("Pixel Launcher isn't responding") or crash ("Google keeps stopping"). Dismiss those.
# The patterns deliberately exclude Saleshiker, so an ANR or crash of the app under test
# still fails the test.
- repeat:
    times: 10
    while:
      notVisible: ${output.signIn.subtitle}
    commands:
      - runFlow:
          when:
            visible: '(?!Saleshiker).* isn.t responding'
          commands:
            - tapOn: "Wait"
      - runFlow:
          when:
            visible: '(?!Saleshiker).* keeps stopping'
          commands:
            - tapOn: "Close app"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow: ../../pages/sign-in/assert-displayed.yaml
