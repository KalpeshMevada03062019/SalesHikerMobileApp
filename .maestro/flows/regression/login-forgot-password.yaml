# Opens https://accountsbeta.saleshiker.com/... in the external browser (observed: Chrome).
# Chrome's first-run screen hides the page, so the check is the hand-off itself.
appId: ${MAESTRO_APP_ID || 'com.saleshiker.app'}
name: "MLGN-018 Forgot password opens the reset page in the browser"
tags:
  - regression
  - auth
  - login
onFlowStart:
  - runFlow: ../../pages/load-page-objects.yaml
  - runFlow:
      file: ../common/start-recording.yaml
      env:
        RECORDING_NAME: MLGN-018
onFlowComplete:
  - runFlow: ../common/stop-recording.yaml
  - stopApp: com.android.chrome
---
- runFlow: ../common/launch-app.yaml
- tapOn: ${output.signIn.forgotPassword}
- extendedWaitUntil:
    notVisible: ${output.signIn.subtitle}
    timeout: 15000
    label: "App hands off to the password-reset page"
- takeScreenshot: MLGN-018-handoff
