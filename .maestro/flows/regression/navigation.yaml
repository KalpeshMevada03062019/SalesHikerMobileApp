# Pre-login navigation that is not part of sign-in itself. The browser hand-offs
# (Forgot password, Create workspace) are covered by MLGN-018 and MLGN-019.
appId: ${MAESTRO_APP_ID || 'com.saleshiker.app'}
name: "REG-NAV-01 Scan-a-code screen and theme toggle"
tags:
  - regression
  - navigation
onFlowStart:
  - runFlow: ../../pages/load-page-objects.yaml
  - runFlow:
      file: ../common/start-recording.yaml
      env:
        RECORDING_NAME: REG-NAV-01-navigation
onFlowComplete:
  - runFlow: ../common/stop-recording.yaml
---
# 1. Scan-a-code screen and back
- runFlow: ../common/launch-app.yaml
- runFlow: ../../pages/sign-in/go-to-scan-code.yaml
- assertVisible: ${output.scanCode.instructions}
- assertNotVisible: ${output.signIn.subtitle}
- takeScreenshot: REG-NAV-01-scan-screen
- runFlow: ../../pages/scan-code/go-back.yaml

# 2. Dark / light theme toggle
- tapOn: ${output.header.darkModeToggle}
- assertVisible: ${output.header.lightModeToggle}
- assertNotVisible: ${output.header.darkModeToggle}
- takeScreenshot: REG-NAV-01-dark-mode
- tapOn: ${output.header.lightModeToggle}
- assertVisible: ${output.header.darkModeToggle}
