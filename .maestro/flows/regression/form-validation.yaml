# Field-level validation and password visibility on the sign-in form. No request reaches
# the backend: every submit here is missing a required field.
appId: ${MAESTRO_APP_ID || 'com.saleshiker.app'}
name: "REG-FORM-01 Sign-in form validates each field and toggles password visibility"
tags:
  - regression
  - validation
onFlowStart:
  - runFlow: ../../pages/load-page-objects.yaml
  - runFlow:
      file: ../common/start-recording.yaml
      env:
        RECORDING_NAME: REG-FORM-01-form-validation
onFlowComplete:
  - runFlow: ../common/stop-recording.yaml
---
# 1. Email only -> only the password error
- runFlow: ../common/launch-app.yaml
- runFlow:
    file: ../../pages/sign-in/enter-email.yaml
    env:
      EMAIL: "qa.user@example.com"
- runFlow: ../../pages/sign-in/submit.yaml
- assertVisible: ${output.signIn.errors.passwordRequired}
- assertNotVisible: ${output.signIn.errors.emailRequired}
- takeScreenshot: REG-FORM-01-email-only

# 2. Password only -> only the email error
- runFlow: ../common/launch-app.yaml
- runFlow:
    file: ../../pages/sign-in/enter-password.yaml
    env:
      PASSWORD: "Secret123"
- runFlow: ../../pages/sign-in/submit.yaml
- assertVisible: ${output.signIn.errors.emailRequired}
- assertNotVisible: ${output.signIn.errors.passwordRequired}
- takeScreenshot: REG-FORM-01-password-only

# 3. Password is masked by default and revealed by the eye button
- assertNotVisible: "Secret123"
- tapOn: ${output.signIn.showPassword}
- assertVisible: "Secret123"
- assertVisible: ${output.signIn.hidePassword}
- takeScreenshot: REG-FORM-01-password-shown
- tapOn: ${output.signIn.hidePassword}
- assertNotVisible: "Secret123"
- assertVisible: ${output.signIn.showPassword}
