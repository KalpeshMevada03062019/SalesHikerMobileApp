# Uses the real password with every letter's case swapped. One failed attempt per run.
appId: ${MAESTRO_APP_ID || 'com.saleshiker.app'}
name: "MLGN-007 Password is case-sensitive"
tags:
  - regression
  - auth
  - login
  - requires-login
onFlowStart:
  - runFlow: ../../pages/load-page-objects.yaml
  - runFlow:
      file: ../common/start-recording.yaml
      env:
        RECORDING_NAME: MLGN-007
onFlowComplete:
  - runFlow: ../common/stop-recording.yaml
---
- evalScript: "${output.swappedPassword = MAESTRO_TEST_PASSWORD.split('').map(function (c) { return c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase() }).join('')}"
- assertTrue:
    condition: ${output.swappedPassword !== MAESTRO_TEST_PASSWORD}
    label: "Test password contains letters, so a case-swapped variant differs"
- runFlow: ../common/launch-app.yaml
- runFlow:
    file: ../../pages/sign-in/sign-in-with.yaml
    env:
      EMAIL: ${MAESTRO_TEST_USERNAME}
      PASSWORD: ${output.swappedPassword}
- extendedWaitUntil:
    visible: ${output.signIn.errors.wrongCredentials}
    timeout: 20000
- assertNotVisible: ${output.home.unreadChats}
- takeScreenshot: MLGN-007-rejected
