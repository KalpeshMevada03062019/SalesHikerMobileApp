appId: ${MAESTRO_APP_ID || 'com.saleshiker.app'}
name: "MLGN-006 Unregistered email is rejected with the same generic message"
tags:
  - regression
  - auth
  - login
onFlowStart:
  - runFlow: ../../pages/load-page-objects.yaml
  - runFlow:
      file: ../common/start-recording.yaml
      env:
        RECORDING_NAME: MLGN-006
onFlowComplete:
  - runFlow: ../common/stop-recording.yaml
---
- runFlow: ../common/launch-app.yaml
- runFlow:
    file: ../../pages/sign-in/sign-in-with.yaml
    env:
      EMAIL: "qa.nonexistent.user@example.com"
      PASSWORD: "WrongPassword123!"
- extendedWaitUntil:
    visible: ${output.signIn.errors.wrongCredentials}
    timeout: 20000
- assertVisible: ${output.signIn.subtitle}
- takeScreenshot: MLGN-006-rejected
