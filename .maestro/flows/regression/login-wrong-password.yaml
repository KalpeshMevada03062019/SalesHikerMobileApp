# One failed attempt against the real test account per run (keep low to avoid any lockout).
appId: ${MAESTRO_APP_ID || 'com.saleshiker.app'}
name: "MLGN-005 Wrong password for a registered email is rejected"
tags:
  - regression
  - auth
  - login
  - requires-login
onFlowStart:
  - runFlow: ../../pages/load-page-objects.yaml
  - runFlow:
      file: ../common/start-recording.yaml
      env:
        RECORDING_NAME: MLGN-005
onFlowComplete:
  - runFlow: ../common/stop-recording.yaml
---
- runFlow: ../common/launch-app.yaml
- runFlow:
    file: ../../pages/sign-in/sign-in-with.yaml
    env:
      EMAIL: ${MAESTRO_TEST_USERNAME}
      PASSWORD: "WrongPassword123!"
- extendedWaitUntil:
    visible: ${output.signIn.errors.wrongCredentials}
    timeout: 20000
- assertVisible: ${output.signIn.subtitle}
- assertNotVisible: ${output.home.unreadChats}
- takeScreenshot: MLGN-005-rejected
