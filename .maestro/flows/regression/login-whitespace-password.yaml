appId: ${MAESTRO_APP_ID || 'com.saleshiker.app'}
name: "MLGN-014 Whitespace-only password is treated as empty"
tags:
  - regression
  - auth
  - login
  - validation
onFlowStart:
  - runFlow: ../../pages/load-page-objects.yaml
  - runFlow:
      file: ../common/start-recording.yaml
      env:
        RECORDING_NAME: MLGN-014
onFlowComplete:
  - runFlow: ../common/stop-recording.yaml
---
- runFlow: ../common/launch-app.yaml
- runFlow:
    file: ../../pages/sign-in/sign-in-with.yaml
    env:
      EMAIL: "qa.user@example.com"
      PASSWORD: "     "
- assertVisible: ${output.signIn.errors.passwordRequired}
- assertNotVisible: ${output.signIn.errors.wrongCredentials}
- assertVisible: ${output.signIn.subtitle}
- takeScreenshot: MLGN-014-password-required
